# Per-market-vertical Excel column sets for export/fmcg_landscape.py.
#
# Selected by markets.market_type (batch/db.py registry column, default
# "general") or the market_type param passed directly to export_fmcg_xlsx().
# row_from_verdict() always computes the full field set regardless of
# market_type — this file only controls which columns actually get written.
#
# slim_full = canonical curated landscape (Company…Summary). Used as the
# default export for every market run (run_batch + OpenAI expand).

slim_full:
  - Company
  - Website
  - Founded
  - Headquarters
  - Continent / Geography
  - Operational Presence
  - Ownership
  - Employees
  - Core Categories
  - Specialty Focus
  - Key Brands Represented
  - Retail / E-commerce / Both
  - Distribution Type
  - Contact Person
  - Role
  - Email
  - LinkedIn
  - Office No.
  - Country Code
  - Region Code
  - Summary

# Legacy aliases — both map to slim_full via code (kept for older callers).
fmcg:
  - Founded
  - Headquarters
  - Ownership
  - Employees
  - Website
  - Core Categories
  - Specialty Focus
  - Key Brands Represented
  - Retail / E-commerce / Both
  - Distribution Type
  - Contact Person
  - Role
  - Email
  - LinkedIn
  - Office No.
  - Country Code
  - Region Code

general:
